services:
  - type: web
    name: freshman-encyclopedia
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/community.sqlite
      - key: TRUST_PROXY
        value: true
    disk:
      name: freshman-data
      mountPath: /var/data
      sizeGB: 1
